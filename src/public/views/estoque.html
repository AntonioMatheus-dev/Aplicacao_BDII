<div class="section-header">
    <h1>Controle de Estoque</h1>
     <div class="filters">
         <input type="number" id="estoque-limite" placeholder="Limite (ex: 10)" style="padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-input); color: white;">
         <button class="btn-secondary" onclick="window.app.loadEstoqueBaixo()">Filtrar Baixo Estoque</button>
     </div>
</div>
<div class="data-table-container">
     <table class="data-table" id="table-estoque">
        <thead>
            <tr>
                <th>ID</th>
                <th>Produto</th>
                <th>Estoque Atual</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
