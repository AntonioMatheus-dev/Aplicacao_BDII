<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-cube"></i>
                    <span>Estoque-PLUS</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item active" data-target="dashboard">
                        <a href="#"><i class="fa-solid fa-chart-line"></i> <span>Dashboard</span></a>
                    </li>
                    <li class="nav-section-title">Gerenciamento</li>
                    <li class="nav-item" data-target="produtos">
                        <a href="#"><i class="fa-solid fa-box"></i> <span>Produtos</span></a>
                    </li>
                    <li class="nav-item" data-target="estoque">
                        <a href="#"><i class="fa-solid fa-warehouse"></i> <span>Estoque</span></a>
                    </li>
                    <li class="nav-item" data-target="compras">
                        <a href="#"><i class="fa-solid fa-cart-shopping"></i> <span>Compras</span></a>
                    </li>
                    <li class="nav-item" data-target="vendas">
                        <a href="#"><i class="fa-solid fa-money-bill-trend-up"></i> <span>Vendas</span></a>
                    </li>
                    <li class="nav-section-title">Pessoas</li>
                    <li class="nav-item" data-target="clientes">
                        <a href="#"><i class="fa-solid fa-users"></i> <span>Clientes</span></a>
                    </li>
                    <li class="nav-item" data-target="fornecedores">
                        <a href="#"><i class="fa-solid fa-truck"></i> <span>Fornecedores</span></a>
                    </li>
                    <li class="nav-item" data-target="pessoas">
                        <a href="#"><i class="fa-solid fa-user-tag"></i> <span>Todas Pessoas</span></a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar">A</div>
                    <div class="details">
                        <span class="name">Admin</span>
                        <span class="role">Gerente</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Pesquisar...">
                </div>
                <div class="top-actions">
                    <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                    <button class="icon-btn"><i class="fa-solid fa-gear"></i></button>
                </div>
            </header>

            <div class="content-area" id="content-area">
                <!-- Views will be injected here dynamically -->
            </div>
        </main>
    </div>

    <!-- Generate Modal (Generic) -->
    <div class="modal-overlay" id="generic-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Título</h2>
                <button class="close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Forms injected here -->
            </div>
            <div class="modal-footer">
                <button class="btn-secondary close-modal">Cancelar</button>
                <button class="btn-primary" id="modal-save">Salvar</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
